<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="252" viewBox="0 0 1000 252" role="img" aria-labelledby="title description">
  <title id="title">Alihan</title>
  <desc id="description">Portfolio banner with a dark grid and a teal parametric curve.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1628"/>
      <stop offset="1" stop-color="#14283a"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#bdd8e8" stroke-opacity=".11"/>
    </pattern>
    <clipPath id="bounds"><rect x="1" y="1" width="998" height="250" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1000" height="252" fill="url(#background)"/>
    <rect x="590" width="410" height="252" fill="url(#grid)"/>
    <g transform="translate(800 126)">
      <path d="M-166 0H166M0-105V105" fill="none" stroke="#7fa5b8" stroke-opacity=".34"/>
      <circle r="80" fill="none" stroke="#8eabca" stroke-opacity=".38" stroke-dasharray="3 5"/>
      <ellipse rx="135" ry="60" fill="none" stroke="#80eed7" stroke-width="2.6" transform="rotate(-31)"/>
      <ellipse rx="135" ry="60" fill="none" stroke="#91a6f8" stroke-width="1.5" stroke-opacity=".7" transform="rotate(31)"/>
      <circle cx="96" cy="-57" r="5" fill="#baf9e9"/>
      <circle cx="-96" cy="-57" r="4" fill="#adbbff"/>
      <circle r="4" fill="#d9e9f7"/>
    </g>
    <rect x="52" y="52" width="28" height="4" rx="2" fill="#80eed7"/>
    <text x="92" y="58" fill="#a9f2e2" font-family="monospace" font-size="16" letter-spacing="2.4">DEVELOPER PORTFOLIO</text>
    <text x="49" y="138" fill="#f4f8fd" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="78">Alihan</text>
    <text x="54" y="192" fill="#c4d4e6" font-family="Segoe UI, Arial, sans-serif" font-size="25">Unity, web, and desktop projects</text>
  </g>
  <rect x="1" y="1" width="998" height="250" rx="22" fill="none" stroke="#436177"/>
</svg>
